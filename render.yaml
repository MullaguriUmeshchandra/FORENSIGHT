# ==============================================================================
# Render Blueprint Specification (render.yaml)
# Unified Full-Stack Forensic Deployment: FastAPI + Embedded React Frontend
# ==============================================================================
services:
  - type: web
    name: forensight-app
    runtime: python
    buildCommand: bash build.sh
    startCommand: python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./forensics.db
      - key: UPLOAD_DIR
        value: ./uploads
