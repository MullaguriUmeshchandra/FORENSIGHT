services:
  # ==============================================================================
  # 1. CyberForensics Backend API (FastAPI / Uvicorn)
  # ==============================================================================
  - type: web
    name: cyberforensics-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: UPLOAD_DIR
        value: ./uploads
      - key: REPORT_DIR
        value: ./reports
      - key: DATABASE_URL
        value: sqlite:///./forensics.db

  # ==============================================================================
  # 2. CyberForensics Frontend Web Application (React / Vite Single Page App)
  # ==============================================================================
  - type: web
    name: cyberforensics-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: cyberforensics-backend
          property: url
