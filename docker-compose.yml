version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: forensics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forensics_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forensics_password}
      POSTGRES_DB: ${POSTGRES_DB:-forensics_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forensics_user} -d ${POSTGRES_DB:-forensics_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.18.0-community
    container_name: forensics-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-forensics_neo4j_password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forensics-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-forensics_user}:${POSTGRES_PASSWORD:-forensics_password}@postgres:5432/${POSTGRES_DB:-forensics_db}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-forensics_neo4j_password}
      JWT_SECRET: ${JWT_SECRET:-forensics_super_secret_jwt_key_reconstruction_2026_x99182374}
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://127.0.0.1:3000","http://127.0.0.1:5173"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./data/samples:/app/data/samples

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
